# Zero warnings is a constitutional requirement (not aspirational): unused
# imports/locals are promoted from warning to error so CI fails on them
# rather than merely flagging them.
include: package:flutter_lints/flutter.yaml

analyzer:
  plugins:
    - custom_lint
  errors:
    unused_import: error
    unused_local_variable: error
    unused_element: error
    unused_field: error
    dead_code: error
    todo: ignore

linter:
  rules:
    always_declare_return_types: true
    prefer_final_locals: true
    require_trailing_commas: true

custom_lint:
  rules:
    - no_wall_clock
    - no_service_locator_outside_root
    - no_string_literals_in_widgets
    - no_io_in_voice_feature
