name: dry_run
description: "Dry Run — talk through one coding-interview problem a day with a Socratic tutor that already knows the answer and will not hand it over."
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  get_it: ^9.2.1
  go_router: ^17.5.0
  dio: ^5.11.0
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  sqlite3_flutter_libs: ^0.5.42
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  flutter_secure_storage: ^11.0.0
  speech_to_text: ">=7.4.0 <7.5.0"
  permission_handler: ^13.0.1
  connectivity_plus: ^7.3.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  share_plus: ^13.3.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  shared_preferences: ^2.5.5
  equatable: ^2.1.0
  # Web demo only (feature 007): fetch streaming and the host page bridge.

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  drift_dev: ^2.31.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  custom_lint: ^0.8.1
  app_lints:
    path: tools/lints

  # Generates the adaptive-icon set from assets/icon/ — see SHIP.md section 4.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  # Unflagged flutter run/build installs app.dryrun.dev beside the prod app. Prod needs --flavor prod.
  default-flavor: dev

dependency_overrides:
  # permission_handler_android 14.0.0's own android/build.gradle.kts uses
  # the `kotlin { compilerOptions { ... } }` DSL without ever applying the
  # Kotlin Gradle plugin, so the Kotlin script compiler can't resolve
  # `kotlin` as anything but the two unrelated `kotlin(...)` dependency-
  # notation functions — a build-breaking bug in that specific release
  # (published 2026-07-31), not anything in this project's own Gradle
  # config. 13.0.1 is the last release before that churn, has a plain,
  # working `build.gradle`, and satisfies permission_handler 13.0.1's own
  # `permission_handler_platform_interface` requirement. Remove this
  # override once a patched permission_handler_android ships.
  permission_handler_android: 13.0.1

# Launcher icon — see SHIP.md section 4 and assets/icon/README.md.
# Regenerate the source PNGs with `python3 tools/icon/generate.py`, then
# `dart run flutter_launcher_icons`. min_sdk_android matches build.gradle.kts.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_monochrome: "assets/icon/monochrome.png"
  # The source foreground is already fitted to the 66dp safe circle by
  # tools/icon/generate.py, so the package's default 16% inset would
  # double-pad it to ~42.8dp — under the spec's 48dp minimum.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 31
